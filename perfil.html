<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3d6a4b">
  <meta name="description" content="Tu perfil en Rewear.">
  <title>Mi perfil — Rewear</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="perfil">
  <div class="app-shell">
    <header class="header" id="app-header" data-title="Mi perfil"></header>
    <main class="main app-stage stack">
      <section class="card card--pad" style="text-align:center;">
        <div class="avatar" style="width:72px;height:72px;margin:0 auto var(--space-sm);">
          <span class="material-symbols-outlined" style="font-size:36px;">person</span>
        </div>
        <h1 class="headline-md">Ana Gómez</h1>
        <p class="caption">Donante particular · San Isidro</p>
        <p style="margin-top: var(--space-sm);"><span class="tag">18 donaciones</span></p>
      </section>
      <a class="card row-card" href="donar.html">
        <span class="row-left">
          <span class="icon-tile"><span class="material-symbols-outlined">inventory_2</span></span>
          <span><strong class="headline-sm">Mis donaciones</strong><span class="caption" style="display:block;">Historial y próximos retiros</span></span>
        </span>
        <span class="material-symbols-outlined" style="color:var(--outline);">chevron_right</span>
      </a>
      <a class="card row-card" href="impacto.html">
        <span class="row-left">
          <span class="icon-tile"><span class="material-symbols-outlined">eco</span></span>
          <span><strong class="headline-sm">Mi impacto</strong><span class="caption" style="display:block;">42 prendas salvadas</span></span>
        </span>
        <span class="material-symbols-outlined" style="color:var(--outline);">chevron_right</span>
      </a>
      <a class="card row-card" href="nosotros.html">
        <span class="row-left">
          <span class="icon-tile"><span class="material-symbols-outlined">groups</span></span>
          <span><strong class="headline-sm">Nosotros</strong><span class="caption" style="display:block;">Quiénes somos y cómo trabajamos</span></span>
        </span>
        <span class="material-symbols-outlined" style="color:var(--outline);">chevron_right</span>
      </a>
    </main>
    <nav class="bottom-nav" id="app-nav"></nav>
  </div>
  <script src="assets/js/app.js"></script>
</body>
</html>
